<!doctype html>
<html lang="ja" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="description" content="残り時間が赤で見える、シンプルな60分タイマー">
  <meta property="og:title" content="みえるタイマー">
  <meta property="og:description" content="残り時間が赤で見える、シンプルな60分タイマー">
  <meta property="og:image" content="https://nmrknt.github.io/mieru-timer/og-image.png?v=1">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nmrknt.github.io/mieru-timer/">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="みえるタイマー">
  <title>みえるタイマー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180-v2.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="timer" aria-label="ビジュアルタイマー">
      <div id="dial" class="dial" role="slider" tabindex="0" aria-label="時間設定" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0">
        <svg id="clock" viewBox="0 0 400 400" aria-hidden="true">
          <defs>
            <linearGradient id="caseGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d49caf"/>
              <stop offset="1" stop-color="#e4bdc9"/>
            </linearGradient>
            <linearGradient id="knobGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset="1" stop-color="#ececea"/>
            </linearGradient>
          </defs>
          <rect class="case" x="7" y="7" width="386" height="386" rx="76"/>
          <rect class="face" x="29" y="29" width="342" height="342" rx="58"/>
          <path id="redSector" class="sector"/>
          <line id="zeroLine" class="zero-line" x1="200" y1="200" x2="200" y2="84"/>
          <circle id="redTip" class="sector-tip" cx="200" cy="84" r="7"/>
          <g id="ticks"></g>
          <g id="numbers"></g>
          <circle class="hub-shadow" cx="202" cy="203" r="20"/>
          <circle class="hub" cx="200" cy="200" r="19"/>
        </svg>
      </div>

      <div class="readout" aria-live="polite">
        <span id="timeText">00:00</span>
        <span id="stateText" class="state">0分</span>
      </div>

      <div class="adjust" aria-label="時間を調整">
        <button id="minus" class="round secondary" type="button" aria-label="1分減らす">−</button>
        <span id="minutesText">0分</span>
        <button id="plus" class="round secondary" type="button" aria-label="1分増やす">＋</button>
      </div>

      <div class="controls">
        <button id="startPause" class="primary" type="button" disabled>スタート</button>
        <button id="reset" class="secondary reset" type="button">リセット</button>
      </div>
      <label class="alarm-setting" for="alarmRepeat">
        終了音の回数
        <select id="alarmRepeat">
          <option value="1">1回</option>
          <option value="2">2回</option>
          <option value="3" selected>3回</option>
          <option value="4">4回</option>
          <option value="5">5回</option>
          <option value="6">6回</option>
          <option value="7">7回</option>
          <option value="8">8回</option>
          <option value="9">9回</option>
          <option value="10">10回</option>
        </select>
      </label>
      <p class="hint">文字盤をタップ、または針の方向へなぞって時間を設定</p>
      <div class="pwa-guide">
        <strong>iPhoneでアプリとして使う方法</strong>
        <ol>
          <li><a href="https://nmrknt.github.io/mieru-timer" target="_blank" rel="noopener noreferrer">このページ</a>をSafariで開く</li>
          <li>画面下の共有ボタン（四角から上向き矢印）をタップ</li>
          <li>メニューを下へスクロールし、「ホーム画面に追加」をタップ</li>
          <li>右上の「追加」をタップ</li>
          <li>ホーム画面の「みえるタイマー」アイコンから起動</li>
        </ol>
        <p>終了音を鳴らすには、iPhoneの消音モードを解除し、音量を上げてください。更新後も古い画面が出る場合は、Safariでこのページを再読み込みしてからアプリを開き直してください。</p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
