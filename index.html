<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="みえるタイマー">
  <title>みえるタイマー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="timer" aria-label="ビジュアルタイマー">
      <div id="dial" class="dial" role="slider" tabindex="0" aria-label="時間設定" aria-valuemin="1" aria-valuemax="60" aria-valuenow="15">
        <svg id="clock" viewBox="0 0 400 400" aria-hidden="true">
          <circle class="face" cx="200" cy="200" r="190"/>
          <path id="redSector" class="sector"/>
          <g id="ticks"></g>
          <g id="numbers"></g>
          <circle class="hub-shadow" cx="200" cy="200" r="27"/>
          <circle class="hub" cx="200" cy="200" r="23"/>
          <circle class="hub-dot" cx="200" cy="200" r="4"/>
        </svg>
      </div>

      <div class="readout" aria-live="polite">
        <span id="timeText">15:00</span>
        <span id="stateText" class="state">15分</span>
      </div>

      <div class="adjust" aria-label="時間を調整">
        <button id="minus" class="round secondary" type="button" aria-label="1分減らす">−</button>
        <span id="minutesText">15分</span>
        <button id="plus" class="round secondary" type="button" aria-label="1分増やす">＋</button>
      </div>

      <div class="controls">
        <button id="startPause" class="primary" type="button">スタート</button>
        <button id="reset" class="secondary reset" type="button">リセット</button>
      </div>
      <p class="hint">文字盤をタップ、または針の方向へなぞって時間を設定</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
